# ============================================================
# 1. СТАДИИ (stages) — определяем порядок этапов
# ============================================================
stages:
  - test      # сначала проверяем код
  - build     # потом собираем образ

# ============================================================
# 2. ПЕРЕМЕННЫЕ (variables) — удобные для всего пайплайна
# ============================================================
variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:latest
  # $CI_REGISTRY_IMAGE — это встроенная переменная GitLab,
  # которая содержит адрес твоего registry:
  # например, registry.gitlab.com/твой_логин/todo-list

# ============================================================
# 3. СТАДИЯ: TEST (проверяем, что код работает)
# ============================================================
test-api:
  stage: test
  image: python:3.10-alpine   # в каком контейнере запускаем
  before_script:
    # Команды, которые выполняются ДО основной работы
    - pip install --no-cache-dir -r requirements.txt
  script:
    # Основные команды — здесь мы проверяем, что код загружается
    - echo "=== Запуск тестов ==="
    - python -c "
import app;
# Проверяем, что приложение создано без ошибок
assert app.app is not None;
print('✅ Приложение загрузилось корректно')
"
    - echo "=== Все тесты пройдены ==="
  only:
    # Запускаем эту джобу только для ветки master
    - master

# ============================================================
# 4. СТАДИЯ: BUILD (собираем Docker-образ)
# ============================================================
build-image:
  stage: build
  image: docker:latest           # контейнер с Docker
  services:
    - docker:dind                # Docker-in-Docker — чтобы внутри контейнера можно было запускать docker build
  before_script:
    # Логинимся в GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "=== Сборка Docker-образа ==="
    - docker build -t $IMAGE_NAME .
    - echo "=== Публикация образа в GitLab Registry ==="
    - docker push $IMAGE_NAME
    - echo "✅ Образ успешно загружен"
  only:
    - main