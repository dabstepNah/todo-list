stages:
  - test

test-api:
  stage: test
  image: python:3.10-alpine
  before_script:
    - pip install --no-cache-dir -r requirements.txt ### установка необходимых зависимостей
  script:
    - echo "=== Запускаем API в фоне ==="
    - python app.py &
    - sleep 3
    - echo "=== Проверяем ответ ==="
    - curl -s http://localhost:5000 | grep -q "Todo API is running"
    - echo "✅ Тест пройден: API отвечает правильно"
  only:
    - master